<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#101418">
<title>Varstakatu 2</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<canvas id="view"></canvas>

<div id="loading">
  <div class="loading-card">
    <div class="loading-title">Varstakatu 2</div>
    <div class="loading-bar"><div id="loading-fill"></div></div>
    <div id="loading-text">Ladataan…</div>
  </div>
</div>

<header id="topbar">
  <div class="brand">Varstakatu 2<span>Naantali</span></div>
  <div id="clock" aria-live="off">17.00</div>
</header>

<div id="views" role="group" aria-label="Näkymät">
  <button data-view="Kamera - Etupiha" class="chip">Etupiha</button>
  <button data-view="Kamera - Katu" class="chip">Katu</button>
  <button data-view="Kamera - Takapiha" class="chip">Takapiha</button>
  <button data-view="Kamera - Ilmasta" class="chip">Ilmasta</button>
</div>

<footer id="controls">
  <div class="presets" role="group" aria-label="Kellonaika">
    <button data-time="7" class="chip">Aamu</button>
    <button data-time="12.5" class="chip">Päivä</button>
    <button data-time="18" class="chip">Ilta</button>
    <button data-time="22.8" class="chip">Yö</button>
    <button id="play" class="chip" aria-pressed="false">▶ Aikalisä</button>
  </div>
  <div class="slider-row">
    <span class="icon" aria-hidden="true">🌙</span>
    <input id="time" type="range" min="0" max="24" step="0.02" value="17" aria-label="Kellonaika">
    <span class="icon" aria-hidden="true">☀️</span>
  </div>
  <div class="row-small">
    <label>Päivämäärä <input id="date" type="date" value="2026-07-15"></label>
    <label>Utu <input id="haze" type="range" min="0" max="2" step="0.05" value="1"></label>
    <button id="settings" class="chip small">Laatu: <b id="quality-label">auto</b></button>
  </div>
</footer>

<script type="module" src="js/main.js"></script>
</body>
</html>
